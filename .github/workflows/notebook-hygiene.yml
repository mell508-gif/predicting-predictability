name: Notebook hygiene cleanup

on:
  push:
    branches:
      - cleanup-notebook-hygiene

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-notebook-hygiene
          fetch-depth: 0

      - name: Sanitize notebook comments and saved outputs
        shell: bash
        run: |
          python - <<'PY'
          import io
          import json
          import pathlib
          import re
          import tokenize

          ROOT = pathlib.Path('.')
          NOTEBOOKS = sorted((ROOT / 'notebooks' / 'final').glob('*.ipynb')) + sorted((ROOT / 'notebooks' / 'archive').glob('*.ipynb'))

          suspicious_comment = re.compile(
              r"(?i)(\byour\b|\byou\b|let['’]s\b|\bchatgpt\b|\bopenai\b|\bassistant\b|"
              r"\bi recommend\b|\bi suggest\b|\bcopy(?:\s+and)?\s+paste\b|\breplace\b.{0,120}\bwith\b)"
          )
          suspicious_markdown = re.compile(
              r"(?i)(\bchatgpt\b|\bopenai\b|\bas an ai\b|\bi recommend\b|\bi suggest\b|"
              r"\bcopy(?:\s+and)?\s+paste\b|\breplace\b.{0,120}\bwith your\b)"
          )

          LOCAL_ROOT_SLASH = '/Users/mell/predicting-predictability/'
          LOCAL_ROOT = '/Users/mell/predicting-predictability'

          def source_to_text(source):
              return ''.join(source) if isinstance(source, list) else (source or '')

          def text_to_source(text, original):
              if isinstance(original, list):
                  return text.splitlines(keepends=True)
              return text

          def comment_positions(text):
              positions = []
              try:
                  for tok in tokenize.generate_tokens(io.StringIO(text).readline):
                      if tok.type == tokenize.COMMENT and suspicious_comment.search(tok.string):
                          positions.append(tok.start)
              except (tokenize.TokenError, IndentationError):
                  # Conservative fallback: only remove whole-line comments.
                  for i, line in enumerate(text.splitlines(), start=1):
                      stripped = line.lstrip()
                      if stripped.startswith('#') and suspicious_comment.search(stripped):
                          positions.append((i, len(line) - len(stripped)))
              return positions

          def remove_suspicious_comments(text):
              lines = text.splitlines(keepends=True)
              positions = comment_positions(text)
              for row, col in sorted(positions, reverse=True):
                  idx = row - 1
                  if not (0 <= idx < len(lines)):
                      continue
                  line = lines[idx]
                  newline = '\n' if line.endswith('\n') else ''
                  body = line[:-1] if newline else line
                  prefix = body[:col].rstrip()
                  lines[idx] = prefix + newline
              return ''.join(lines), len(positions)

          def strip_all_comments(text):
              lines = text.splitlines(keepends=True)
              positions = []
              try:
                  for tok in tokenize.generate_tokens(io.StringIO(text).readline):
                      if tok.type == tokenize.COMMENT:
                          positions.append(tok.start)
              except (tokenize.TokenError, IndentationError):
                  return None
              for row, col in sorted(positions, reverse=True):
                  idx = row - 1
                  line = lines[idx]
                  newline = '\n' if line.endswith('\n') else ''
                  body = line[:-1] if newline else line
                  lines[idx] = body[:col].rstrip() + newline
              return '\n'.join(x.rstrip() for x in ''.join(lines).splitlines())

          def sanitize_string(s):
              return s.replace(LOCAL_ROOT_SLASH, '').replace(LOCAL_ROOT, '.')

          def sanitize_obj(obj):
              if isinstance(obj, str):
                  return sanitize_string(obj)
              if isinstance(obj, list):
                  return [sanitize_obj(x) for x in obj]
              if isinstance(obj, dict):
                  return {k: sanitize_obj(v) for k, v in obj.items()}
              return obj

          def output_text(output):
              parts = []
              text = output.get('text')
              if isinstance(text, str):
                  parts.append(text)
              elif isinstance(text, list):
                  parts.extend(str(x) for x in text)
              data = output.get('data', {})
              if isinstance(data, dict):
                  for key in ('text/plain', 'text/markdown'):
                      val = data.get(key)
                      if isinstance(val, str):
                          parts.append(val)
                      elif isinstance(val, list):
                          parts.extend(str(x) for x in val)
              return ''.join(parts)

          def is_debug_output(output):
              txt = output_text(output)
              if "On branch main" in txt and "Your branch is ahead of 'origin/main'" in txt:
                  return True
              if 'Current folder:' in txt:
                  return True
              if 'Project root:' in txt and any(marker in txt for marker in ('Score file found:', 'Required files:', 'Embedding file found:')):
                  return True
              return False

          total_comments = 0
          total_errors = 0
          total_debug = 0
          total_paths = 0
          total_markdown = 0
          changed_files = 0

          for path in NOTEBOOKS:
              original_text = path.read_text(encoding='utf-8')
              nb = json.loads(original_text)
              stats = {'comments': 0, 'errors': 0, 'debug': 0, 'paths': 0, 'markdown': 0}

              for cell in nb.get('cells', []):
                  ctype = cell.get('cell_type')
                  original_source = cell.get('source', [])
                  source_text = source_to_text(original_source)

                  if ctype == 'code':
                      cleaned_source, n = remove_suspicious_comments(source_text)
                      if n:
                          before_surface = strip_all_comments(source_text)
                          after_surface = strip_all_comments(cleaned_source)
                          if before_surface is not None and after_surface is not None and before_surface != after_surface:
                              raise RuntimeError(f'Executable code changed while cleaning comments: {path}')
                          cell['source'] = text_to_source(cleaned_source, original_source)
                          stats['comments'] += n

                      old_outputs = cell.get('outputs', [])
                      new_outputs = []
                      for output in old_outputs:
                          if output.get('output_type') == 'error':
                              stats['errors'] += 1
                              continue
                          if is_debug_output(output):
                              stats['debug'] += 1
                              continue
                          raw = json.dumps(output, ensure_ascii=False)
                          stats['paths'] += raw.count(LOCAL_ROOT)
                          new_outputs.append(sanitize_obj(output))
                      cell['outputs'] = new_outputs

                  elif ctype == 'markdown' and suspicious_markdown.search(source_text):
                      kept = []
                      removed = 0
                      for line in source_text.splitlines(keepends=True):
                          if suspicious_markdown.search(line):
                              removed += 1
                          else:
                              kept.append(line)
                      if removed:
                          cell['source'] = text_to_source(''.join(kept), original_source)
                          stats['markdown'] += removed

              rendered = json.dumps(nb, ensure_ascii=False, indent=1) + '\n'
              # Validation: notebook remains valid JSON and no local home path survives.
              json.loads(rendered)
              if LOCAL_ROOT in rendered:
                  raise RuntimeError(f'Unsanitized local path remains in {path}')

              # Validation: suspicious reader-addressing comments are gone.
              for cell in nb.get('cells', []):
                  if cell.get('cell_type') == 'code':
                      remaining = comment_positions(source_to_text(cell.get('source', [])))
                      if remaining:
                          raise RuntimeError(f'Suspicious comment remains in {path}: {remaining[:3]}')
                  if cell.get('cell_type') == 'code':
                      for output in cell.get('outputs', []):
                          if output.get('output_type') == 'error':
                              raise RuntimeError(f'Error output remains in {path}')

              if rendered != original_text:
                  path.write_text(rendered, encoding='utf-8')
                  changed_files += 1

              total_comments += stats['comments']
              total_errors += stats['errors']
              total_debug += stats['debug']
              total_paths += stats['paths']
              total_markdown += stats['markdown']
              print(f"{path}: {stats}")

          if len(NOTEBOOKS) != 9:
              raise RuntimeError(f'Expected 9 notebooks, found {len(NOTEBOOKS)}')

          print('\nSUMMARY')
          print(f'notebooks scanned: {len(NOTEBOOKS)}')
          print(f'notebooks changed: {changed_files}')
          print(f'suspicious comments removed: {total_comments}')
          print(f'error outputs removed: {total_errors}')
          print(f'debug outputs removed: {total_debug}')
          print(f'local path occurrences normalized: {total_paths}')
          print(f'assistant-like markdown lines removed: {total_markdown}')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
            exit 0
          fi
          git commit -m "Clean notebook comments and outputs"
          git push origin HEAD:cleanup-notebook-hygiene
